<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة امتحان - منصة الباسط</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/admin-forms.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <header class="admin-header">
        <div class="container">
            <div class="admin-header-content">
                <div class="logo"><a href="admin.html" class="logo-text">الباسط</a><span class="admin-badge">إضافة امتحان</span></div>
                <a href="admin.html" class="btn btn-outline btn-light">← رجوع</a>
            </div>
        </div>
    </header>
    <main class="form-page">
        <div class="container">
            <form id="examForm" class="admin-form-card">
                <h1 class="form-page-title">إضافة امتحان</h1>
                <div class="form-row">
                    <div class="form-group"><label for="examGrade">الصف</label><select id="examGrade" required></select></div>
                    <div class="form-group"><label for="examMonth">الشهر</label><select id="examMonth" required></select></div>
                </div>
                <div class="form-group"><label for="examTitle">عنوان الامتحان</label><input type="text" id="examTitle" required></div>
                <div class="form-group"><label for="examDuration">المدة (دقيقة)</label><input type="number" id="examDuration" value="30" min="5" required></div>
                <div class="pricing-section">
                    <div class="pricing-header">
                        <label class="checkbox-label">
                            <input type="checkbox" id="examFree" onchange="toggleExamPrice()">
                            <span>مجاني</span>
                        </label>
                        <span class="price-badge">مميز</span>
                    </div>
                    <div class="price-input-group" id="examPriceGroup">
                        <label for="examPrice">سعر الامتحان (ج.م)</label>
                        <input type="number" id="examPrice" min="0" step="0.01" placeholder="مثال: 50">
                    </div>
                </div>

                <div class="form-group">
                    <label>ملف صورة/PDF للامتحان (اختياري)</label>
                    <input type="file" id="examFile" accept="image/*,application/pdf">
                    <div id="examFilePreview" style="margin-top:8px;"></div>
                </div>

                <div class="questions-builder">
                    <div class="section-header-inline">
                        <h3>الأسئلة</h3>
                        <button type="button" class="btn btn-outline btn-sm" onclick="addQuestion()">+ إضافة</button>
                    </div>
                    <div id="questionsContainer"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg">حفظ الامتحان</button>
                    <a href="admin.html" class="btn btn-outline">إلغاء</a>
                </div>
            </form>
        </div>
    </main>
    <script src="js/config.js?v=3"></script>
    <script src="js/supabase.js?v=3"></script>
    <script src="js/db.js?v=4"></script>
    <script src="js/r2.js?v=5"></script>
    <script src="js/auth.js?v=8"></script>
    <script src="js/main.js?v=3"></script>
    <script>
        let qIndex = 0;
        const editExamId = new URLSearchParams(location.search).get('edit');
        const isEditMode = !!editExamId;

        function esc(value) {
            return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function setUploadProgress(pct, text) {
            const fill = document.getElementById('progressFill');
            const label = document.getElementById('progressText');
            if (fill) fill.style.width = pct + '%';
            if (label) label.textContent = text || pct + '%';
        }
        function toggleExamPrice() {
            const isFree = document.getElementById('examFree').checked;
            const group = document.getElementById('examPriceGroup');
            group.classList.toggle('hidden', isFree);
            if (isFree) document.getElementById('examPrice').value = '';
        }
        function questionBlockHTML(id, q) {
            q = q || {};
            const isMCQ = q.question_type !== 'true_false';
            const opts = isMCQ ? (Array.isArray(q.options) && q.options.length ? q.options : ['', '', '', '']) : [];
            const answer = q.correct_answer != null ? String(q.correct_answer) : '';
            return `
                <div class="question-block" data-qid="${id}">
                    <div class="form-group">
                        <label>نص السؤال</label>
                        <input type="text" class="q-text" value="${esc(q.question_text)}" required>
                    </div>
                    <div class="form-group">
                        <label>النوع</label>
                        <select class="q-type" onchange="toggleOptions(this)">
                            <option value="mcq"${isMCQ ? ' selected' : ''}>اختيار من متعدد</option>
                            <option value="true_false"${!isMCQ ? ' selected' : ''}>صح / خطأ</option>
                        </select>
                    </div>
                    <div class="q-options"${isMCQ ? '' : ' style="display:none"'}>
                        ${opts.map((o, i) => `<input type="text" class="opt" placeholder="خيار ${i + 1}" value="${esc(o)}">`).join('')}
                    </div>
                    <div class="form-group">
                        <label>الإجابة الصحيحة (رقم الخيار 0-3 أو true/false)</label>
                        <input type="text" class="q-answer" value="${esc(answer)}" required>
                    </div>
                    <button type="button" class="btn btn-outline btn-sm" onclick="this.closest('.question-block').remove()">حذف</button>
                </div>`;
        }
        function addQuestion() {
            const id = qIndex++;
            document.getElementById('questionsContainer').insertAdjacentHTML('beforeend', questionBlockHTML(id, null));
        }
        function toggleOptions(sel) {
            const block = sel.closest('.question-block');
            const opts = block.querySelector('.q-options');
            opts.style.display = sel.value === 'mcq' ? 'grid' : 'none';
        }
        document.addEventListener('DOMContentLoaded', async () => {
            if (!await requireAdmin()) return;
            toggleExamPrice();
            const grades = await db.getGrades();
            const g = document.getElementById('examGrade');
            g.innerHTML = grades.map(x => `<option value="${x.id}">${x.name}</option>`).join('');
            async function months() {
                const id = parseInt(g.value);
                await db.ensureNineMonths(id);
                const m = await db.getMonths(id);
                document.getElementById('examMonth').innerHTML = m.map(x => `<option value="${x.id}">${x.name}</option>`).join('');
            }
            g.onchange = months;
            await months();
            document.getElementById('examFile').addEventListener('change', (ev) => {
                const file = ev.target.files[0];
                const preview = document.getElementById('examFilePreview');
                if (file && preview) preview.innerHTML = `<div style="padding:8px;border:1px solid #eee;border-radius:6px;">${file.name} - ${(file.size/1024/1024).toFixed(2)} م.ب</div>`;
            });

            if (isEditMode) {
                try {
                    const exam = await db.getExam(parseInt(editExamId, 10));
                    if (!exam) throw new Error('الامتحان غير موجود');

                    document.title = 'تعديل امتحان - منصة الباسط';
                    const badge = document.querySelector('.admin-badge');
                    if (badge) badge.textContent = 'تعديل امتحان';
                    const title = document.querySelector('.form-page-title');
                    if (title) title.textContent = 'تعديل امتحان';
                    const submitBtn = document.querySelector('#examForm button[type="submit"]');
                    if (submitBtn) submitBtn.textContent = 'حفظ التعديلات';

                    g.value = exam.grade_id || '';
                    await months();
                    document.getElementById('examMonth').value = exam.month_id || '';
                    document.getElementById('examTitle').value = exam.title || '';
                    document.getElementById('examDuration').value = exam.duration || 30;
                    document.getElementById('examFree').checked = !!exam.is_free;
                    toggleExamPrice();
                    if (!exam.is_free && exam.price) document.getElementById('examPrice').value = exam.price;

                    if (exam.file_url) {
                        const preview = document.getElementById('examFilePreview');
                        if (preview) preview.innerHTML = `<div style="padding:8px;border:1px solid #eee;border-radius:6px;">ملف حالي: <a href="${esc(exam.file_url)}" target="_blank">${esc(exam.file_url.split('/').pop())}</a> — اختَر ملفاً جديداً لاستبداله (اختياري)</div>`;
                    }

                    const container = document.getElementById('questionsContainer');
                    container.innerHTML = '';
                    if (exam.exam_questions && exam.exam_questions.length) {
                        exam.exam_questions.forEach(q => {
                            container.insertAdjacentHTML('beforeend', questionBlockHTML(qIndex++, q));
                        });
                    } else {
                        addQuestion();
                    }
                } catch (err) {
                    console.error('Error loading exam for edit:', err);
                    showAlert('تعذر تحميل بيانات الامتحان', 'error');
                    addQuestion();
                }
            } else {
                addQuestion();
            }

            document.getElementById('examForm').onsubmit = async (e) => {
                e.preventDefault();
                const questions = [];
                document.querySelectorAll('.question-block').forEach(block => {
                    const type = block.querySelector('.q-type').value;
                    const opts = [...block.querySelectorAll('.opt')].map(o => o.value).filter(Boolean);
                    questions.push({
                        question_text: block.querySelector('.q-text').value,
                        question_type: type,
                        options: type === 'mcq' ? opts : null,
                        correct_answer: block.querySelector('.q-answer').value,
                        marks: 1
                    });
                });
                if (!questions.length) { showAlert('يرجى إضافة سؤال واحد على الأقل', 'error'); return; }

                const isFree = document.getElementById('examFree').checked;
                const priceInput = document.getElementById('examPrice').value;
                const price = isFree ? 0 : (priceInput ? parseFloat(priceInput) : null);
                if (!isFree && (price === null || isNaN(price))) { showAlert('يرجى إدخال سعر صحيح', 'error'); return; }

                let fileUrl = null;
                const fileInput = document.getElementById('examFile');
                if (fileInput && fileInput.files && fileInput.files[0]) {
                    try {
                        setUploadProgress(0, 'جاري رفع ملف الامتحان...');
                        fileUrl = (await uploadPDF(fileInput.files[0], 'exams', (pct) => setUploadProgress(pct, `رفع ${pct}%`))).secure_url;
                    } catch (err) {
                        console.error('Upload error', err);
                        showAlert('خطأ في الرفع: ' + err.message, 'error');
                        return;
                    } finally {
                        setUploadProgress(100, 'تم');
                    }
                }

                try {
                    const examData = {
                        grade_id: parseInt(g.value),
                        month_id: parseInt(document.getElementById('examMonth').value),
                        title: document.getElementById('examTitle').value,
                        duration: parseInt(document.getElementById('examDuration').value),
                        is_free: isFree
                    };
                    let exam;
                    if (isEditMode) {
                        exam = await db.updateExam(parseInt(editExamId, 10), examData);
                    } else {
                        exam = await db.createExam(examData);
                    }
                    if (fileUrl) {
                        try { await db.updateExam(exam.id, { file_url: fileUrl }); } catch (e) { console.warn('file_url column not available:', e.message); }
                    }
                    await db.saveExamQuestions(exam.id, questions);
                    showAlert(isEditMode ? 'تم تحديث الامتحان' : 'تم حفظ الامتحان', 'success');
                    setTimeout(() => location.href = 'admin.html', 1000);
                } catch (err) { console.error('Exam save error:', err); showAlert('خطأ: ' + (err.message || 'حدث خطأ'), 'error'); }
            };
        });
    </script>
    <style>.q-options { display: grid; gap: 8px; margin-bottom: 12px; } .section-header-inline { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 16px; }</style>
</body>
</html>
